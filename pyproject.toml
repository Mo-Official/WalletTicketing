[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walletticketing"
version = "0.1.0"
description = "Ticketverkauf mit Landing Pages, mehreren Zahlungsarten und Apple/Google Wallet Tickets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "cryptography>=42",
    "PyJWT>=2.8",
    "qrcode>=7.4",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["walletticketing*"]

[tool.setuptools.package-data]
walletticketing = ["templates/**/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
